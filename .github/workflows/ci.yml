name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    # Two Python versions and two operating systems. The first CI run of
    # this repository disagreed with my machine about floating point, which
    # is exactly the class of problem a single-platform build hides.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync environment
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      # The full study runs on generated data with no network access, so CI can
      # execute it end to end. If the committed figures ever stop being
      # reproducible from the committed code, this step fails.
      - name: Reproduce the study
        run: |
          uv run python scripts/fetch_data.py
          uv run python scripts/run_study.py

      # Tables and the manifest only. Figures are deliberately excluded: PNG
      # output is not bit-identical across platforms because font rasterisation
      # depends on the freetype and libpng versions present, and asserting
      # otherwise would be a check that fails for a reason nobody cares about.
      # The numbers are the claim; the figures are drawn from the numbers.
      - name: Check the numbers are unchanged
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: git diff --exit-code -- results/tables results/run_manifest.json
