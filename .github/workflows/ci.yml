name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      # The full study runs on generated data with no network access, so CI can
      # execute it end to end. If the committed figures ever stop being
      # reproducible from the committed code, this step fails.
      - name: Reproduce the study
        run: |
          uv run python scripts/fetch_data.py
          uv run python scripts/run_study.py

      - name: Check results are unchanged
        run: git diff --exit-code -- results/
